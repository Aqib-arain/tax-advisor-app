<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqib Arain - Tax & Credential Vault</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS (AES-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .executive-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.03); }
        .executive-card-hover:hover { border-color: #cbd5e1; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08); transform: translateY(-2px); transition: all 0.2s ease-in-out; }
        .executive-input { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; }
        .executive-input:focus { border-color: #059669; outline: none; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12); }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Security PIN Lock Screen Overlay -->
    <div id="pinLockOverlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-8 text-center space-y-5 shadow-2xl border border-slate-100">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="font-extrabold text-slate-900 text-xl">Aqib Arain Vault</h2>
                <p class="text-xs text-slate-500 mt-1">Enter 4-Digit Security PIN to Unlock</p>
            </div>
            <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="w-full text-center text-3xl tracking-widest font-mono p-3 rounded-2xl executive-input focus:ring-2 focus:ring-emerald-500 outline-none">
            <button onclick="unlockApp()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl shadow-md transition">Unlock App</button>
            <p class="text-[10px] text-slate-400">Default PIN: 1234 (Change in App)</p>
        </div>
    </div>

    <!-- Top Executive Header -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-2xl bg-slate-900 text-emerald-400 flex items-center justify-center font-black text-xl shadow-md">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-extrabold text-lg text-slate-900 tracking-tight">Aqib Arain</h1>
                        <span id="syncIndicator" class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online
                        </span>
                    </div>
                    <p class="text-xs text-slate-500">Tax Advisor & Portal Vault</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="lockApp()" title="Lock App Screen" class="px-3 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-200 transition">
                    <i class="fa-solid fa-lock text-slate-600"></i>
                </button>
                <button onclick="exportToCSV()" class="px-3 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-200 transition flex items-center space-x-1.5">
                    <i class="fa-brands fa-google-drive text-emerald-600 text-sm"></i>
                    <span class="hidden sm:inline">Drive Backup</span>
                </button>
                <button onclick="openClientModal()" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>New Client</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-8">

        <!-- Combined Financial Analytics Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="executive-card p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Deal Fees</p>
                    <h3 id="statAgreed" class="text-xl md:text-2xl font-extrabold text-slate-900 mt-1">Rs. 0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-700 flex items-center justify-center text-lg"><i class="fa-solid fa-handshake"></i></div>
            </div>

            <div class="executive-card p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-emerald-700 uppercase tracking-wider">Combined Received</p>
                    <h3 id="statReceived" class="text-xl md:text-2xl font-extrabold text-emerald-600 mt-1">Rs. 0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-wallet"></i></div>
            </div>

            <div class="executive-card p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-rose-700 uppercase tracking-wider">Combined Remaining</p>
                    <h3 id="statRemaining" class="text-xl md:text-2xl font-extrabold text-rose-600 mt-1">Rs. 0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fa-solid fa-scale-unbalanced"></i></div>
            </div>

            <div class="executive-card p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Active Records</p>
                    <h3 id="statTotalClients" class="text-xl md:text-2xl font-extrabold text-blue-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-users"></i></div>
            </div>
        </div>

        <div class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4">
