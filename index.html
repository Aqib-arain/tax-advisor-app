<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aqib Arain - Tax Vault</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CryptoJS (AES-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; }
        .input-box { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; }
        .input-box:focus { border-color: #059669; outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Hidden File Picker for Import -->
    <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVImport(event)" class="hidden">

    <!-- Security PIN Lock Screen -->
    <div id="pinLockOverlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-xl"><i class="fa-solid fa-lock"></i></div>
            <h2 class="font-extrabold text-slate-900 text-lg">Aqib Arain Vault</h2>
            <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="w-full text-center text-2xl font-mono p-3 rounded-2xl input-box outline-none">
            <button onclick="unlockApp()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-2xl shadow-md">Unlock App</button>
            <div class="flex justify-between text-xs text-slate-400">
                <span>Default PIN: 1234</span>
                <button onclick="changePIN()" class="text-emerald-600 font-bold">Change PIN</button>
            </div>
        </div>
    </div>

    <!-- Header Bar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-slate-900 text-emerald-400 flex items-center justify-center font-black text-base"><i class="fa-solid fa-user-tie"></i></div>
                <div>
                    <h1 class="font-extrabold text-sm sm:text-base text-slate-900">Aqib Arain</h1>
                    <p class="text-[10px] text-slate-500">Tax Advisor Vault</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-1 sm:space-x-1.5">
                <button onclick="syncMenu()" title="Sync Devices" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-200"><i class="fa-solid fa-rotate"></i> <span class="hidden sm:inline">Sync</span></button>
                <button onclick="triggerCSVImport()" title="Import CSV" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-purple-50 text-purple-700 text-xs font-bold border border-purple-200"><i class="fa-solid fa-file-import"></i> <span class="hidden sm:inline">Import</span></button>
                <button onclick="clearAllData()" title="Wipe Data" class="p-2 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold border border-rose-200"><i class="fa-solid fa-trash-can"></i></button>
                <button onclick="changePIN()" title="Change PIN" class="p-2 rounded-xl bg-slate-100 text-amber-600 text-xs font-bold border border-slate-200"><i class="fa-solid fa-key"></i></button>
                <button onclick="lockApp()" title="Lock Screen" class="p-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold border border-slate-200"><i class="fa-solid fa-lock"></i></button>
                <button onclick="exportToCSV()" title="Export CSV" class="p-2 rounded-xl bg-slate-100 text-blue-600 text-xs font-bold border border-slate-200"><i class="fa-solid fa-file-csv"></i></button>
                <button onclick="openClientModal()" class="px-3 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs"><i class="fa-solid fa-plus mr-1"></i> New</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-7xl mx-auto px-3 sm:px-6 mt-4 sm:mt-6 space-y-4 sm:space-y-6">

        <!-- Financial Dashboard Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4">
            <div class="card p-3.5 sm:p-4 rounded-2xl">
                <p class="text-[10px] text-slate-500 uppercase font-bold">Total Deals</p>
                <h3 id="statAgreed" class="text-base sm:text-xl font-extrabold text-slate-900 mt-0.5">Rs. 0</h3>
            </div>
            <div class="card p-3.5 sm:p-4 rounded-2xl">
                <p class="text-[10px] text-emerald-700 uppercase font-bold">Received</p>
                <h3 id="statReceived" class="text-base sm:text-xl font-extrabold text-emerald-600 mt-0.5">Rs. 0</h3>
            </div>
            <div class="card p-3.5 sm:p-4 rounded-2xl">
                <p class="text-[10px] text-rose-700 uppercase font-bold">Remaining</p>
                <h3 id="statRemaining" class="text-base sm:text-xl font-extrabold text-rose-600 mt-0.5">Rs. 0</h3>
            </div>
            <div class="card p-3.5 sm:p-4 rounded-2xl">
                <p class="text-[10px] text-slate-500 uppercase font-bold">Total Clients</p>
                <h3 id="statTotalClients" class="text-base sm:text-xl font-extrabold text-blue-600 mt-0.5">0</h3>
            </div>
        </div>

        <!-- Filters & Search Controls -->
        <div class="space-y-3">
            <div class="flex flex-col sm:flex-row justify-between gap-2.5 border-b pb-3">
                <div class="bg-slate-200/70 p-1 rounded-2xl flex space-x-1 text-xs font-bold overflow-x-auto no-scrollbar">
                    <button onclick="switchPortalTab('ALL')" id="tabALL" class="px-3.5 sm:px-4 py-2 rounded-xl bg-white text-slate-900 shadow-sm whitespace-nowrap">All Clients <span id="badgeALL" class="ml-1 px-1.5 py-0.5 rounded-full bg-slate-100 text-[10px]">0</span></button>
                    <button onclick="switchPortalTab('FBR')" id="tabFBR" class="px-3.5 sm:px-4 py-2 rounded-xl text-slate-600 whitespace-nowrap">FBR Portal <span id="badgeFBR" class="ml-1 px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px]">0</span></button>
                    <button onclick="switchPortalTab('GTE')" id="tabGTE" class="px-3.5 sm:px-4 py-2 rounded-xl text-slate-600 whitespace-nowrap">GTE Portal <span id="badgeGTE" class="ml-1 px-1.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 text-[10px]">0</span></button>
                </div>

                <div class="grid grid-cols-2 sm:flex gap-2 text-xs">
                    <select id="yearFilter" onchange="filterClients()" class="input-box rounded-xl px-2.5 py-2 font-bold"><option value="ALL">All Tax Years</option><option value="2027">TY 2027</option><option value="2026">TY 2026</option><option value="2025">TY 2025</option><option value="2024">TY 2024</option><option value="2023">TY 2023</option></select>
                    <select id="atlFilter" onchange="filterClients()" class="input-box rounded-xl px-2.5 py-2 font-bold"><option value="ALL">All ATL</option><option value="Active">🟢 Active</option><option value="Inactive">🔴 Inactive</option></select>
                </div>
            </div>

            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="filterClients()" placeholder="Search Name, Phone, CNIC, NTN, or Reference..." class="w-full pl-9 pr-4 py-2.5 rounded-2xl input-box text-xs">
            </div>
        </div>

        <!-- Laptop Desktop Table View -->
        <div class="hidden md:block card rounded-3xl overflow-hidden shadow-sm">
            <table class="w-full text-left text-xs border-collapse">
                <thead class="bg-slate-100 text-slate-700 font-bold uppercase text-[10px]">
                    <tr>
                        <th class="py-3 px-4">Portal / Year</th>
                        <th class="py-3 px-4">Client Contact & Ref</th>
                        <th class="py-3 px-4">CNIC & NTN</th>
                        <th class="py-3 px-4">Financials</th>
                        <th class="py-3 px-4">Portal Password</th>
                        <th class="py-3 px-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody" class="divide-y divide-slate-200"></tbody>
            </table>
        </div>

        <!-- Mobile Touch Cards View -->
        <div id="mobileCardsContainer" class="block md:hidden space-y-3"></div>

    </div>

    <!-- Add/Edit Client Modal -->
    <div id="clientModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-end sm:items-center p-0 sm:p-4 hidden">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-5 space-y-3 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 id="modalTitle" class="font-bold text-slate-900 text-base">Add Client Record</h2>
                <button onclick="closeClientModal()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="clientForm" onsubmit="saveClient(event)" class="space-y-3 text-xs">
                <input type="hidden" id="clientId">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div id="wrapperPortalType"><label class="block font-medium mb-1">Portal Category</label><select id="portalType" onchange="togglePortalFields()" class="w-full p-2.5 rounded-xl input-box font-bold text-emerald-700"><option value="FBR">FBR Portal</option><option value="GTE">GTE Portal</option></select></div>
                    <div id="wrapperTaxYear"><label class="block font-medium mb-1">Tax Year</label><select id="taxYear" class="w-full p-2.5 rounded-xl input-box font-bold text-blue-700"><option value="2027">TY 2027</option><option value="2026" selected>TY 2026</option><option value="2025">TY 2025</option><option value="2024">TY 2024</option><option value="2023">TY 2023</option></select></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div id="wrapperFullName"><label class="block font-medium mb-1">Full Name</label><input type="text" id="fullName" placeholder="Client Name" class="w-full p-2.5 rounded-xl input-box"></div>
                    <div id="wrapperAtlStatus"><label class="block font-medium mb-1">ATL Filer Status</label><select id="atlStatus" class="w-full p-2.5 rounded-xl input-box font-bold"><option value="Active">🟢 ATL Active</option><option value="Inactive">🔴 ATL Inactive</option></select></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div><label class="block font-medium mb-1">Phone Number (11 Digits)</label><input type="text" id="phone" placeholder="03001234567" oninput="formatPhone(this)" maxlength="11" class="w-full p-2.5 rounded-xl input-box font-mono"></div>
                    <div><label class="block font-medium mb-1">Email Address</label><input type="email" id="email" placeholder="Optional Email" class="w-full p-2.5 rounded-xl input-box"></div>
                </div>

                <div id="rowCnicNtn" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div><label class="block font-medium mb-1">CNIC Number</label><input type="text" id="cnic" placeholder="12345-1234567-1" oninput="formatCNIC(this)" maxlength="15" class="w-full p-2.5 rounded-xl input-box font-mono"></div>
                    <div><label class="block font-medium mb-1">NTN Number (7 Digits)</label><input type="text" id="ntn" placeholder="1234567" oninput="formatNTN(this)" maxlength="7" class="w-full p-2.5 rounded-xl input-box font-mono"></div>
                </div>

                <div><label class="block font-medium mb-1"><i class="fa-solid fa-user-tag text-indigo-500 mr-1"></i> Referred By (Reference)</label><input type="text" id="referredBy" placeholder="Name or CNIC of person who referred this client" class="w-full p-2.5 rounded-xl input-box"></div>

                <div class="p-3 bg-slate-50 rounded-2xl border space-y-2">
                    <span class="font-bold text-slate-800 text-xs"><i class="fa-solid fa-coins text-amber-500 mr-1"></i> Fee & Payment Deal</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block font-medium mb-1">Deal Fee (Rs.)</label><input type="number" id="feeAgreed" placeholder="0" oninput="autoCalculateFeeStatus()" class="w-full p-2 rounded-xl input-box font-mono"></div>
                        <div><label class="block font-medium mb-1">Fee Received (Rs.)</label><input type="number" id="feeReceived" placeholder="0" oninput="autoCalculateFeeStatus()" class="w-full p-2 rounded-xl input-box font-mono font-bold text-emerald-700"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div><label class="block font-medium mb-1">Payment Status</label><select id="paymentStatus" class="w-full p-2 rounded-xl input-box"><option value="Unpaid">Unpaid</option><option value="Partial">Partial Pay</option><option value="Paid">Paid</option></select></div>
                        <div><label class="block font-medium mb-1">Contact Status</label><select id="contactStatus" class="w-full p-2 rounded-xl input-box"><option value="Not Contacted">Not Contacted</option><option value="Contacted">Contacted</option></select></div>
                    </div>
                </div>

                <div id="wrapperTaxPassword"><label class="block font-medium mb-1">Tax Portal Password</label><input type="text" id="taxPassword" placeholder="Optional Password" class="w-full p-2.5 rounded-xl input-box font-mono"></div>

                <div><label class="block font-medium mb-1">Notes / Filing Details</label><textarea id="notes" rows="2" placeholder="Optional Notes..." class="w-full p-2.5 rounded-xl input-box"></textarea></div>

                <div class="pt-2 flex justify-end space-x-2 border-t">
                    <button type="button" onclick="closeClientModal()" class="px-4 py-2 rounded-xl text-slate-500">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 text-white font-bold rounded-xl shadow-md">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Engine -->
    <script>
        const SECRET_KEY = "tax-advisor-secret-key";
        let clientsData = [];
        let activeTab = 'ALL';
        let APP_PIN = localStorage.getItem('aqib_app_pin') || '1234';

        function generateUUID() { return 'id-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now().toString(36); }
        function encryptText(text) { return text ? CryptoJS.AES.encrypt(text, SECRET_KEY).toString() : ''; }
        function decryptText(cipher) { 
            if (!cipher) return '';
            try { return CryptoJS.AES.decrypt(cipher, SECRET_KEY).toString(CryptoJS.enc.Utf8) || cipher; } catch(e) { return cipher; }
        }

        // 📋 FAST & FAIL-PROOF DEVICE SYNC ENGINE
        function syncMenu() {
            Swal.fire({
                title: '🔄 Fast Device Sync',
                html: `
                    <div class="space-y-2.5 pt-2 text-left text-xs font-sans">
                        <button onclick="Swal.close(); generateLaptopCode();" class="w-full p-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                            <i class="fa-solid fa-code"></i> 📋 Step 1: Copy Laptop Sync Code
                        </button>
                        <button onclick="Swal.close(); pastePhoneCode();" class="w-full p-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paste"></i> 📥 Step 2: Paste Code on Mobile Phone
                        </button>
                    </div>
                `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Close',
                cancelButtonColor: '#64748b'
            });
        }

        function generateLaptopCode() {
            if (clientsData.length === 0) {
                Swal.fire({ icon: 'warning', title: 'Vault is Empty', text: 'Import or add clients on your laptop first.' });
                return;
            }

            const jsonString = JSON.stringify(clientsData);
            const encoded = btoa(unescape(encodeURIComponent(jsonString)));

            Swal.fire({
                title: '📋 Laptop Sync Code',
                text: 'Copy this code and paste it into "Step 2" on your mobile phone:',
                input: 'textarea',
                inputValue: encoded,
                inputAttributes: { readonly: true, class: 'font-mono text-[11px] p-2' },
                showCancelButton: true,
                confirmButtonText: 'Copy Sync Code',
                confirmButtonColor: '#059669',
                cancelButtonText: 'Close'
            }).then((res) => {
                if (res.isConfirmed) {
                    navigator.clipboard.writeText(encoded);
                    Swal.fire({ icon: 'success', title: 'Code Copied!', text: 'Send this code to your phone (via WhatsApp/Email), open your phone, and tap Step 2!', timer: 2500 });
                }
            });
        }

        function pastePhoneCode() {
            Swal.fire({
                title: '📥 Paste Mobile Sync Code',
                text: 'Paste the Sync Code generated from your laptop:',
                input: 'textarea',
                inputPlaceholder: 'Paste Sync Code here...',
                showCancelButton: true,
                confirmButtonText: 'Import All Clients',
                confirmButtonColor: '#059669'
            }).then((res) => {
                if (res.isConfirmed && res.value) {
                    try {
                        const rawJson = decodeURIComponent(escape(atob(res.value.trim())));
                        const data = JSON.parse(rawJson);

                        if (Array.isArray(data) && data.length > 0) {
                            clientsData = data;
                            localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData));
                            updateCombinedFinancials();
                            filterClients();

                            Swal.fire({
                                icon: 'success',
                                title: 'Sync Complete!',
                                text: `Successfully loaded ${clientsData.length} records onto your mobile phone!`,
                                confirmButtonColor: '#059669'
                            });
                        } else {
                            throw new Error("Invalid array");
                        }
                    } catch(err) {
                        Swal.fire({ icon: 'error', title: 'Invalid Code', text: 'Could not read clients from that code. Make sure you copied the full Sync Code.' });
                    }
                }
            });
        }

        // Wipe All Data
        async function clearAllData() {
            const confirm = await Swal.fire({ title: 'Wipe Vault Data?', text: 'Are you sure you want to delete all client records?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48' });
            if (confirm.isConfirmed) {
                const pinPrompt = await Swal.fire({ title: 'Enter PIN to confirm:', input: 'password', inputAttributes: { maxlength: 4 }, showCancelButton: true });
                if (pinPrompt.isConfirmed && pinPrompt.value === APP_PIN) {
                    clientsData = [];
                    localStorage.setItem('aqib_clients_cache', JSON.stringify([]));
                    updateCombinedFinancials();
                    filterClients();
                    Swal.fire({ icon: 'success', title: 'Vault Cleared!' });
                }
            }
        }

        // CSV Import Engine
        function triggerCSVImport() { document.getElementById('csvFileInput').click(); }
        function handleCSVImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split(/\r\n|\n/);
                let imported = [];
                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const cols = line.split(',').map(c => c.replace(/^"(.*)"$/, '$1').trim());
                    if (cols.length >= 2) {
                        let user = cols.length >= 4 ? (cols[2] || cols[0]) : cols[0];
                        let pass = cols.length >= 4 ? cols[3] : cols[1];
                        if (index === 0 && (user.toLowerCase().includes('user') || pass.toLowerCase().includes('pass') || cols[0] === 'Portal')) return;
                        if (user && pass) {
                            let cleanCNIC = user.replace(/\D/g, '').length === 13 ? user.replace(/\D/g, '').slice(0,5)+'-'+user.replace(/\D/g, '').slice(5,12)+'-'+user.replace(/\D/g, '').slice(12,13) : '';
                            imported.push({
                                id: generateUUID(), portal_type: 'FBR', tax_year: '2026', atl_status: 'Active',
                                full_name: cleanCNIC ? 'Client (' + cleanCNIC + ')' : user, phone: '', email: '', cnic: cleanCNIC, ntn: '',
                                referred_by: 'Excel Import', fee_agreed: 0, fee_received: 0, tax_portal_password_encrypted: encryptText(pass),
                                payment_status: 'Unpaid', contact_status: 'Not Contacted', notes: 'Imported'
                            });
                        }
                    }
                });

                if (imported.length > 0) {
                    clientsData = [...imported, ...clientsData];
                    localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData));
                    updateCombinedFinancials();
                    filterClients();
                    Swal.fire({ icon: 'success', title: 'Import Complete!', text: `Imported ${imported.length} records! Click Sync ➔ Step 1 to send to phone.` });
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        // Form Limiters & Formatters
        function formatCNIC(input) { let v = input.value.replace(/\D/g, ''); if (v.length > 5 && v.length <= 12) v = v.slice(0,5)+'-'+v.slice(5); else if (v.length > 12) v = v.slice(0,5)+'-'+v.slice(5,12)+'-'+v.slice(12,13); input.value = v; }
        function formatPhone(input) { let v = input.value.replace(/\D/g, ''); if (v.length > 11) v = v.slice(0, 11); input.value = v; }
        function formatNTN(input) { let v = input.value.replace(/\D/g, ''); if (v.length > 7) v = v.slice(0, 7); input.value = v; }

        function changePIN() {
            Swal.fire({ title: 'Enter Current PIN:', input: 'password', showCancelButton: true }).then((res) => {
                if (res.isConfirmed && res.value === APP_PIN) {
                    Swal.fire({ title: 'Enter NEW 4-Digit PIN:', input: 'password', inputAttributes: { maxlength: 4 }, showCancelButton: true }).then((newRes) => {
                        if (newRes.isConfirmed && newRes.value.length === 4) {
                            APP_PIN = newRes.value;
                            localStorage.setItem('aqib_app_pin', newRes.value);
                            Swal.fire({ icon: 'success', title: 'PIN Updated!' });
                        }
                    });
                }
            });
        }

        function togglePortalFields() {
            const isGTE = document.getElementById('portalType').value === 'GTE';
            document.getElementById('wrapperTaxYear').classList.toggle('hidden', isGTE);
            document.getElementById('wrapperAtlStatus').classList.toggle('hidden', isGTE);
            document.getElementById('rowCnicNtn').classList.toggle('hidden', isGTE);
            document.getElementById('wrapperTaxPassword').classList.toggle('hidden', isGTE);
            document.getElementById('wrapperFullName').className = isGTE ? "col-span-1 sm:col-span-2" : "col-span-1";
            document.getElementById('wrapperPortalType').className = isGTE ? "col-span-1 sm:col-span-2" : "col-span-1";
        }

        function lockApp() { document.getElementById('pinInput').value = ''; document.getElementById('pinLockOverlay').classList.remove('hidden'); }
        function unlockApp() { if (document.getElementById('pinInput').value === APP_PIN) document.getElementById('pinLockOverlay').classList.add('hidden'); else Swal.fire({ icon: 'error', title: 'Incorrect PIN' }); }

        // WhatsApp Messaging Engine
        function openWhatsApp(id) {
            const c = clientsData.find(x => x.id === id);
            if (!c) return;
            if (!c.phone) {
                Swal.fire({ title: 'Enter Phone Number:', input: 'text', showCancelButton: true }).then((res) => {
                    if (res.isConfirmed && res.value) { c.phone = res.value; localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData)); sendWA(c); }
                });
                return;
            }
            sendWA(c);
        }

        function sendWA(c) {
            let cleanPhone = c.phone.replace(/\D/g, '');
            if (cleanPhone.startsWith('0')) cleanPhone = '92' + cleanPhone.substring(1);
            const remaining = (parseFloat(c.fee_agreed) || 0) - (parseFloat(c.fee_received) || 0);

            Swal.fire({
                title: '📱 Select WhatsApp Format',
                html: `
                    <select id="waSelect" class="w-full p-3 rounded-xl border text-xs bg-slate-50 font-medium">
                        <option value="1">💰 1. Fee Balance Reminder</option>
                        <option value="2">✅ 2. Filing Confirmation</option>
                        <option value="3">🔑 3. Share Portal Credentials</option>
                        <option value="4">📞 4. Call Request (Information Needed)</option>
                        <option value="5">🟢 5. ATL Active Status Confirmation</option>
                        <option value="6">⚠️ 6. FBR Notice Alert</option>
                        <option value="7">📅 7. Tax Season 2026 Filing Invitation</option>
                    </select>`,
                showCancelButton: true, confirmButtonText: 'Send WhatsApp', confirmButtonColor: '#059669'
            }).then((res) => {
                if (res.isConfirmed) {
                    const sel = document.getElementById('waSelect').value;
                    let msg = '';
                    if (sel === '1') msg = `Mohtaram ${c.full_name} Sahab, aap ki Tax Return file ho chuki hai. Baqi fees Rs. ${remaining.toLocaleString()} hai. Baraye meherbani adaigi karein. Shukriya! - Aqib Arain`;
                    if (sel === '2') msg = `Mohtaram ${c.full_name} Sahab, Assalam-o-Alaikum! Aap ki Income Tax Return successful file ho gayi hai. Aqib Arain shukriya!`;
                    if (sel === '3') msg = `Mohtaram ${c.full_name} Sahab, Tax Portal Login details:\n📌 CNIC: ${c.cnic || 'N/A'}\n🔑 Password: ${decryptText(c.tax_portal_password_encrypted) || 'N/A'}\n- Aqib Arain`;
                    if (sel === '4') msg = `Mohtaram ${c.full_name} Sahab, Tax Return ke liye kuch malumat ki zarorat hai. Free ho kar call karein. - Aqib Arain`;
                    if (sel === '5') msg = `Mohtaram ${c.full_name} Sahab, Mubarak ho! FBR Active Taxpayer List (ATL) mein aap ka naam Active (🟢) ho chuka hai. - Aqib Arain`;
                    if (sel === '6') msg = `Mohtaram ${c.full_name} Sahab, FBR Portal par Statutory Notice/Letter aya hai. Jald az jald rabta karein. - Aqib Arain`;
                    if (sel === '7') msg = `Mohtaram ${c.full_name} Sahab, Tax Year 2026 Return filing shuru ho chuki hai. FBR penalty se bachne ke liye aaj hi file karwayein. - Aqib Arain`;
                    if (msg) window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
                }
            });
        }

        function autoCalculateFeeStatus() {
            const agreed = parseFloat(document.getElementById('feeAgreed').value) || 0;
            const received = parseFloat(document.getElementById('feeReceived').value) || 0;
            const sel = document.getElementById('paymentStatus');
            if (received <= 0) sel.value = 'Unpaid'; else if (received >= agreed && agreed > 0) sel.value = 'Paid'; else sel.value = 'Partial';
        }

        function loadClientsData() {
            const cached = localStorage.getItem('aqib_clients_cache');
            if (cached) { try { clientsData = JSON.parse(cached); } catch(e) { clientsData = []; } }
            updateCombinedFinancials();
            filterClients();
        }

        function updateCombinedFinancials() {
            let totalAgreed = 0, totalReceived = 0;
            clientsData.forEach(c => { totalAgreed += parseFloat(c.fee_agreed || 0); totalReceived += parseFloat(c.fee_received || 0); });
            document.getElementById('statAgreed').innerText = `Rs. ${totalAgreed.toLocaleString()}`;
            document.getElementById('statReceived').innerText = `Rs. ${totalReceived.toLocaleString()}`;
            document.getElementById('statRemaining').innerText = `Rs. ${(totalAgreed - totalReceived).toLocaleString()}`;
            document.getElementById('statTotalClients').innerText = clientsData.length;
            document.getElementById('badgeALL').innerText = clientsData.length;
            document.getElementById('badgeFBR').innerText = clientsData.filter(c => (c.portal_type || 'FBR') === 'FBR').length;
            document.getElementById('badgeGTE').innerText = clientsData.filter(c => c.portal_type === 'GTE').length;
        }

        function switchPortalTab(tab) {
            activeTab = tab;
            ['ALL', 'FBR', 'GTE'].forEach(t => { document.getElementById(`tab${t}`).className = t === tab ? "px-3.5 sm:px-4 py-2 rounded-xl bg-white text-slate-900 font-bold shadow-sm whitespace-nowrap" : "px-3.5 sm:px-4 py-2 rounded-xl text-slate-600 whitespace-nowrap"; });
            filterClients();
        }

        function filterClients() {
            const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const yearF = document.getElementById('yearFilter')?.value || 'ALL';
            const atlF = document.getElementById('atlFilter')?.value || 'ALL';

            const filtered = clientsData.filter(c => {
                const portal = c.portal_type || 'FBR';
                const matchTab = activeTab === 'ALL' || portal === activeTab;
                const matchSearch = (c.full_name || '').toLowerCase().includes(q) || (c.phone || '').includes(q) || (c.cnic || '').includes(q) || (c.ntn || '').toLowerCase().includes(q) || (c.referred_by || '').toLowerCase().includes(q);
                const matchYear = yearF === 'ALL' || portal === 'GTE' || (c.tax_year || '2026') === yearF;
                const matchATL = atlF === 'ALL' || portal === 'GTE' || (c.atl_status || 'Active') === atlF;
                return matchTab && matchSearch && matchYear && matchATL;
            });
            renderClients(filtered);
        }

        function renderClients(list) {
            const tbody = document.getElementById('clientTableBody');
            const mobileContainer = document.getElementById('mobileCardsContainer');
            tbody.innerHTML = ''; mobileContainer.innerHTML = '';

            if (list.length === 0) {
                const emptyHTML = `<div class="text-center py-12 text-slate-400 font-medium card rounded-2xl p-6"><i class="fa-solid fa-folder-open text-4xl mb-2 block"></i>Vault is Empty. Click "Import" to upload credentials or "Sync" to load code.</div>`;
                tbody.innerHTML = `<tr><td colspan="6" class="p-0">${emptyHTML}</td></tr>`;
                mobileContainer.innerHTML = emptyHTML;
                return;
            }

            list.forEach(c => {
                const cid = c.id || generateUUID(); c.id = cid;
                const decPass = decryptText(c.tax_portal_password_encrypted);
                const agreed = parseFloat(c.fee_agreed || 0), received = parseFloat(c.fee_received || 0);

                // Laptop Row
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 px-4"><span class="px-2 py-0.5 text-[10px] font-bold rounded ${c.portal_type === 'GTE' ? 'bg-indigo-100 text-indigo-800' : 'bg-emerald-100 text-emerald-800'}">${c.portal_type || 'FBR'}</span> ${c.portal_type === 'FBR' ? `<span class="text-[10px] font-bold text-blue-700 ml-1">TY ${c.tax_year || '2026'}</span>` : ''}</td>
                    <td class="py-3 px-4"><div class="font-bold text-slate-900">${c.full_name || 'Unnamed'}</div><div class="text-slate-500 text-xs"><i class="fa-solid fa-phone mr-1"></i>${c.phone || '-'} <button onclick="openWhatsApp('${cid}')" class="text-emerald-600 font-bold ml-1"><i class="fa-brands fa-whatsapp"></i></button></div>${c.referred_by ? `<div class="text-[10px] text-indigo-600 font-medium">Ref: ${c.referred_by}</div>` : ''}</td>
                    <td class="py-3 px-4 font-mono text-xs">CNIC: ${c.cnic || '-'}<br>NTN: ${c.ntn || '-'}</td>
                    <td class="py-3 px-4 text-xs"><span class="font-bold text-slate-700">Rs. ${agreed.toLocaleString()}</span> (Rec: ${received.toLocaleString()})</td>
                    <td class="py-3 px-4 font-mono text-xs"><span id="pass-${cid}">••••••••</span> ${decPass ? `<button onclick="togglePassword('${cid}')" class="ml-1 text-slate-400"><i id="eye-${cid}" class="fa-solid fa-eye"></i></button>` : ''}</td>
                    <td class="py-3 px-4 text-right space-x-2"><button onclick="editClient('${cid}')" class="text-blue-600 font-bold"><i class="fa-solid fa-pen"></i></button><button onclick="deleteClient('${cid}')" class="text-rose-600 font-bold"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);

                // Mobile Card
                const mCard = document.createElement('div');
                mCard.className = "card p-4 rounded-2xl space-y-2 text-xs";
                mCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="px-2 py-0.5 text-[9px] font-bold rounded ${c.portal_type === 'GTE' ? 'bg-indigo-100 text-indigo-800' : 'bg-emerald-100 text-emerald-800'}">${c.portal_type || 'FBR'}</span>
                            <h3 class="font-bold text-slate-900 text-sm mt-1">${c.full_name || 'Unnamed'}</h3>
                            <div class="text-slate-500"><i class="fa-solid fa-phone mr-1"></i>${c.phone || '-'} <button onclick="openWhatsApp('${cid}')" class="text-emerald-600 font-bold ml-1"><i class="fa-brands fa-whatsapp"></i></button></div>
                            ${c.referred_by ? `<div class="text-[10px] text-indigo-600 font-medium">Ref: ${c.referred_by}</div>` : ''}
                        </div>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${c.payment_status === 'Paid' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${c.payment_status || 'Unpaid'}</span>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-xl flex justify-between">
                        <span>Agreed: <strong>Rs. ${agreed.toLocaleString()}</strong></span>
                        <span>Rec: <strong class="text-emerald-700">Rs. ${received.toLocaleString()}</strong></span>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-xl space-y-1 font-mono">
                        ${c.cnic ? `<div>CNIC: <strong>${c.cnic}</strong></div>` : ''}
                        ${decPass ? `<div class="flex justify-between items-center"><span>Pass: <strong id="mpass-${cid}">••••••••</strong></span><div><button onclick="togglePassword('${cid}')" class="text-slate-400 mr-2"><i id="meye-${cid}" class="fa-solid fa-eye"></i></button><button onclick="copyPassword('${cid}')" class="text-emerald-600"><i class="fa-regular fa-copy"></i></button></div></div>` : ''}
                    </div>
                    <div class="flex justify-end gap-2 pt-1 border-t">
                        <button onclick="editClient('${cid}')" class="px-2.5 py-1 bg-slate-100 text-blue-700 font-bold rounded-lg"><i class="fa-solid fa-pen mr-1"></i>Edit</button>
                        <button onclick="deleteClient('${cid}')" class="px-2.5 py-1 bg-rose-50 text-rose-700 font-bold rounded-lg"><i class="fa-solid fa-trash mr-1"></i>Delete</button>
                    </div>`;
                mobileContainer.appendChild(mCard);
            });
        }

        function togglePassword(id) {
            const c = clientsData.find(x => x.id === id); if (!c) return;
            const pass = decryptText(c.tax_portal_password_encrypted);
            ['pass-', 'mpass-'].forEach(p => { const el = document.getElementById(p + id); if (el) el.innerText = el.innerText === '••••••••' ? pass : '••••••••'; });
        }

        function copyPassword(id) {
            const c = clientsData.find(x => x.id === id); if (!c) return;
            navigator.clipboard.writeText(decryptText(c.tax_portal_password_encrypted));
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Copied!', timer: 1500, showConfirmButton: false });
        }

        async function saveClient(e) {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const portalVal = document.getElementById('portalType').value;
            const passVal = document.getElementById('taxPassword').value;

            const payload = {
                id: id || generateUUID(), portal_type: portalVal,
                tax_year: portalVal === 'FBR' ? document.getElementById('taxYear').value : 'N/A',
                atl_status: portalVal === 'FBR' ? document.getElementById('atlStatus').value : 'N/A',
                full_name: document.getElementById('fullName').value || 'Unnamed Client',
                phone: document.getElementById('phone').value || '', email: document.getElementById('email').value || '',
                cnic: portalVal === 'FBR' ? document.getElementById('cnic').value : '', ntn: portalVal === 'FBR' ? document.getElementById('ntn').value : '',
                referred_by: document.getElementById('referredBy').value || '',
                fee_agreed: parseFloat(document.getElementById('feeAgreed').value) || 0, fee_received: parseFloat(document.getElementById('feeReceived').value) || 0,
                tax_portal_password_encrypted: (portalVal === 'FBR' && passVal) ? encryptText(passVal) : '',
                payment_status: document.getElementById('paymentStatus').value, contact_status: document.getElementById('contactStatus').value,
                notes: document.getElementById('notes').value || ''
            };

            if (id) { const idx = clientsData.findIndex(x => x.id === id); if (idx !== -1) clientsData[idx] = payload; } else clientsData.unshift(payload);
            localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData));
            updateCombinedFinancials(); filterClients(); closeClientModal();
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Saved!', timer: 1500, showConfirmButton: false });
        }

        function editClient(id) {
            const c = clientsData.find(x => x.id === id); if (!c) return;
            document.getElementById('clientId').value = c.id;
            document.getElementById('portalType').value = c.portal_type || 'FBR'; togglePortalFields();
            document.getElementById('taxYear').value = c.tax_year || '2026'; document.getElementById('atlStatus').value = c.atl_status || 'Active';
            document.getElementById('fullName').value = c.full_name || ''; document.getElementById('phone').value = c.phone || '';
            document.getElementById('email').value = c.email || ''; document.getElementById('cnic').value = c.cnic || '';
            document.getElementById('ntn').value = c.ntn || ''; document.getElementById('referredBy').value = c.referred_by || '';
            document.getElementById('feeAgreed').value = c.fee_agreed || 0; document.getElementById('feeReceived').value = c.fee_received || 0;
            document.getElementById('taxPassword').value = decryptText(c.tax_portal_password_encrypted);
            document.getElementById('paymentStatus').value = c.payment_status || 'Unpaid'; document.getElementById('contactStatus').value = c.contact_status || 'Not Contacted';
            document.getElementById('notes').value = c.notes || '';
            document.getElementById('clientModal').classList.remove('hidden');
        }

        async function deleteClient(id) {
            const confirm = await Swal.fire({ title: 'Delete Client?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48' });
            if (confirm.isConfirmed) {
                clientsData = clientsData.filter(x => x.id !== id);
                localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData));
                updateCombinedFinancials(); filterClients();
            }
        }

        function openClientModal() { document.getElementById('clientForm').reset(); document.getElementById('clientId').value = ''; togglePortalFields(); document.getElementById('clientModal').classList.remove('hidden'); }
        function closeClientModal() { document.getElementById('clientModal').classList.add('hidden'); }

        function exportToCSV() {
            let csv = "Portal,Tax Year,ATL Status,Full Name,Phone,Email,CNIC,NTN,Referred By,Fee Agreed,Fee Received,Tax Password,Notes\n";
            clientsData.forEach(c => { csv += `"${c.portal_type}","${c.tax_year}","${c.atl_status}","${c.full_name}","${c.phone}","${c.email}","${c.cnic}","${c.ntn}","${c.referred_by}","${c.fee_agreed}","${c.fee_received}","${decryptText(c.tax_portal_password_encrypted)}","${c.notes}"\n`; });
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `Tax_Vault_Backup_${new Date().toISOString().slice(0,10)}.csv`; a.click();
        }

        loadClientsData();
    </script>
</body>
</html>
