<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Client Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS (AES-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="pb-20">

    <!-- Header Navigation -->
    <nav class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid me-1 fa-file-invoice-dollar text-emerald-400 text-2xl"></i>
                <h1 class="font-bold text-lg">Tax Client Manager</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="exportToCSV()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-2 rounded-lg border border-slate-700 flex items-center">
                    <i class="fa-solid fa-file-csv mr-1 text-emerald-400"></i> Export CSV
                </button>
                <button onclick="openClientModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center">
                    <i class="fa-solid fa-plus mr-1"></i> Add Client
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-4 space-y-4">

        <!-- Search & Filter Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
            <!-- Search Bar -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterClients()" placeholder="Search by Name, Phone, CNIC, or NTN..." 
                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <!-- Filter Tags -->
            <div class="flex flex-wrap gap-2 pt-1 border-t border-gray-100 text-xs">
                <span class="text-gray-500 font-medium my-auto mr-1">Filters:</span>
                <select id="paymentFilter" onchange="filterClients()" class="bg-gray-50 border border-gray-300 rounded-lg px-2.5 py-1.5 focus:outline-none">
                    <option value="ALL">Payment: All</option>
                    <option value="Paid">Paid Only</option>
                    <option value="Unpaid">Unpaid Only</option>
                </select>
                <select id="contactFilter" onchange="filterClients()" class="bg-gray-50 border border-gray-300 rounded-lg px-2.5 py-1.5 focus:outline-none">
                    <option value="ALL">Contact: All</option>
                    <option value="Contacted">Contacted Only</option>
                    <option value="Not Contacted">Not Contacted Only</option>
                </select>
            </div>
        </div>

        <!-- Client List Stats -->
        <div class="flex justify-between items-center px-1 text-xs text-gray-500">
            <span>Showing <strong id="recordCount" class="text-gray-800">0</strong> records</span>
            <span id="syncStatus" class="text-emerald-600 font-medium"><i class="fa-solid fa-circle-check mr-1"></i> Synced with Cloud</span>
        </div>

        <!-- Clients List Container -->
        <div id="clientList" class="space-y-3">
            <!-- Client Cards Injected Here Dynamically -->
        </div>
    </div>

    <!-- Add/Edit Client Modal -->
    <div id="clientModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="modalTitle" class="font-bold text-gray-800 text-lg">Add New Client</h2>
                <button onclick="closeClientModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="clientForm" onsubmit="saveClient(event)" class="space-y-3 text-sm">
                <input type="hidden" id="clientId">
                
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Full Name *</label>
                    <input type="text" id="fullName" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Phone Number *</label>
                        <input type="text" id="phone" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Email *</label>
                        <input type="email" id="email" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">CNIC (XXXXX-XXXXXXX-X) *</label>
                        <input type="text" id="cnic" required placeholder="12345-1234567-1" oninput="formatCNIC(this)" maxlength="15" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none font-mono">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">NTN Number (Optional)</label>
                        <input type="text" id="ntn" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-gray-700 mb-1">Tax Portal Password *</label>
                    <input type="text" id="taxPassword" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none font-mono">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Payment Status</label>
                        <select id="paymentStatus" class="w-full p-2.5 border rounded-lg outline-none bg-white">
                            <option value="Unpaid">Unpaid</option>
                            <option value="Paid">Paid</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">Contact Status</label>
                        <select id="contactStatus" class="w-full p-2.5 border rounded-lg outline-none bg-white">
                            <option value="Not Contacted">Not Contacted</option>
                            <option value="Contacted">Contacted</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-gray-700 mb-1">Notes</label>
                    <textarea id="notes" rows="2" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>

                <div class="pt-3 flex justify-end space-x-2">
                    <button type="button" onclick="closeClientModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-semibold">Save Client</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script>
        // Supabase Credentials
        const SUPABASE_URL = "https://xmrprtdsucbqkyflbgfj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_MfURv5DghN1mAHOHhgpYhA_TtiuEdtT";
        const SECRET_KEY = "tax-advisor-local-key"; // Secret key for AES-256

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let clientsData = [];

        // Encrypt/Decrypt Helpers
        function encryptText(text) { return CryptoJS.AES.encrypt(text, SECRET_KEY).toString(); }
        function decryptText(cipher) { 
            try {
                const bytes = CryptoJS.AES.decrypt(cipher, SECRET_KEY);
                return bytes.toString(CryptoJS.enc.Utf8) || cipher;
            } catch(e) { return cipher; }
        }

        // CNIC Auto-Formatter
        function formatCNIC(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 5 && v.length <= 12) {
                v = v.slice(0,5) + '-' + v.slice(5);
            } else if (v.length > 12) {
                v = v.slice(0,5) + '-' + v.slice(5,12) + '-' + v.slice(12,13);
            }
            input.value = v;
        }

        // Load Clients
        async function fetchClients() {
            const { data, error } = await supabaseClient.from('clients').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error("Error fetching clients:", error);
                document.getElementById('syncStatus').innerHTML = `<span class="text-amber-600"><i class="fa-solid fa-wifi"></i> Offline Mode</span>`;
                return;
            }
            clientsData = data || [];
            localStorage.setItem('cached_clients', JSON.stringify(clientsData));
            renderClients(clientsData);
        }

        // Render Cards
        function renderClients(list) {
            document.getElementById('recordCount').innerText = list.length;
            const container = document.getElementById('clientList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-gray-400">No client records found.</div>`;
                return;
            }

            list.forEach(c => {
                const decPass = decryptText(c.tax_portal_password_encrypted);
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-900 text-base">${c.full_name}</h3>
                            <div class="text-xs text-gray-500 space-x-2 mt-0.5">
                                <span><i class="fa-solid fa-phone text-gray-400"></i> ${c.phone}</span>
                                <span>•</span>
                                <span><i class="fa-solid fa-envelope text-gray-400"></i> ${c.email}</span>
                            </div>
                        </div>
                        <div class="flex space-x-1 text-xs">
                            <span class="px-2 py-1 rounded-full font-semibold ${c.payment_status === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${c.payment_status}</span>
                            <span class="px-2 py-1 rounded-full font-semibold ${c.contact_status === 'Contacted' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'}">${c.contact_status}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-gray-50 p-2.5 rounded-lg text-xs font-mono">
                        <div><span class="text-gray-400 block font-sans">CNIC:</span><strong>${c.cnic}</strong></div>
                        <div><span class="text-gray-400 block font-sans">NTN:</span><strong>${c.ntn || 'N/A'}</strong></div>
                        <div class="col-span-2 sm:col-span-1">
                            <span class="text-gray-400 block font-sans">Portal Password:</span>
                            <div class="flex items-center space-x-1">
                                <span id="pass-${c.id}" class="font-bold text-slate-800">${decPass}</span>
                                <button onclick="copyToClipboard('${decPass}')" class="text-emerald-600 hover:text-emerald-800 ml-1"><i class="fa-regular fa-copy"></i></button>
                            </div>
                        </div>
                    </div>

                    ${c.notes ? `<p class="text-xs text-gray-600 bg-amber-50/50 border border-amber-100 p-2 rounded-lg"><i class="fa-solid fa-note-sticky text-amber-500 mr-1"></i> ${c.notes}</p>` : ''}

                    <div class="flex justify-between items-center pt-2 border-t text-xs">
                        <span class="text-gray-400">ID: ${c.id.substring(0,8)}...</span>
                        <div class="space-x-3">
                            <button onclick="editClient('${c.id}')" class="text-blue-600 hover:underline"><i class="fa-solid fa-pen"></i> Edit</button>
                            <button onclick="deleteClient('${c.id}')" class="text-rose-600 hover:underline"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Search and Filter
        function filterClients() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const payF = document.getElementById('paymentFilter').value;
            const conF = document.getElementById('contactFilter').value;

            const filtered = clientsData.filter(c => {
                const matchesSearch = c.full_name.toLowerCase().includes(query) ||
                                      c.phone.includes(query) ||
                                      c.cnic.includes(query) ||
                                      (c.ntn && c.ntn.toLowerCase().includes(query));
                const matchesPay = payF === 'ALL' || c.payment_status === payF;
                const matchesCon = conF === 'ALL' || c.contact_status === conF;
                return matchesSearch && matchesPay && matchesCon;
            });

            renderClients(filtered);
        }

        // Save / Update Client
        async function saveClient(e) {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const payload = {
                full_name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                cnic: document.getElementById('cnic').value,
                ntn: document.getElementById('ntn').value,
                tax_portal_password_encrypted: encryptText(document.getElementById('taxPassword').value),
                payment_status: document.getElementById('paymentStatus').value,
                contact_status: document.getElementById('contactStatus').value,
                notes: document.getElementById('notes').value
            };

            if (id) {
                await supabaseClient.from('clients').update(payload).eq('id', id);
            } else {
                await supabaseClient.from('clients').insert([payload]);
            }

            closeClientModal();
            fetchClients();
        }

        // Edit Modal
        function editClient(id) {
            const c = clientsData.find(x => x.id === id);
            if (!c) return;
            document.getElementById('clientId').value = c.id;
            document.getElementById('fullName').value = c.full_name;
            document.getElementById('phone').value = c.phone;
            document.getElementById('email').value = c.email;
            document.getElementById('cnic').value = c.cnic;
            document.getElementById('ntn').value = c.ntn || '';
            document.getElementById('taxPassword').value = decryptText(c.tax_portal_password_encrypted);
            document.getElementById('paymentStatus').value = c.payment_status;
            document.getElementById('contactStatus').value = c.contact_status;
            document.getElementById('notes').value = c.notes || '';
            document.getElementById('modalTitle').innerText = "Edit Client Record";
            document.getElementById('clientModal').classList.remove('hidden');
        }

        // Delete Client
        async function deleteClient(id) {
            if (confirm("Are you sure you want to PERMANENTLY delete this client record?")) {
                await supabaseClient.from('clients').delete().eq('id', id);
                fetchClients();
            }
        }

        // Modals Toggle
        function openClientModal() {
            document.getElementById('clientForm').reset();
            document.getElementById('clientId').value = '';
            document.getElementById('modalTitle').innerText = "Add New Client";
            document.getElementById('clientModal').classList.remove('hidden');
        }
        function closeClientModal() { document.getElementById('clientModal').classList.add('hidden'); }

        // Copy Helper
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("Password copied to clipboard!");
        }

        // CSV Export
        function exportToCSV() {
            let csv = "Full Name,Phone,Email,CNIC,NTN,Tax Password,Payment Status,Contact Status,Notes\n";
            clientsData.forEach(c => {
                csv += `"${c.full_name}","${c.phone}","${c.email}","${c.cnic}","${c.ntn || ''}","${decryptText(c.tax_portal_password_encrypted)}","${c.payment_status}","${c.contact_status}","${c.notes || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `tax_clients_backup_${new Date().toISOString().slice(0,10)}.csv`);
            a.click();
        }

        // Initial Load
        fetchClients();
    </script>
</body>
</html>
