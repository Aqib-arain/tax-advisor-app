    <!-- JavaScript Engine -->
    <script>
        const SUPABASE_URL = "https://xmrprtdsucbqkyflbgfj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_MfURv5DghN1mAHOHhgpYhA_TtiuEdtT"; 
        const SECRET_KEY = "tax-advisor-secret-key";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let clientsData = [];
        let activeTab = 'ALL';
        let APP_PIN = localStorage.getItem('aqib_app_pin') || '1234';

        function encryptText(text) { return text ? CryptoJS.AES.encrypt(text, SECRET_KEY).toString() : ''; }
        function decryptText(cipher) { 
            if (!cipher) return '';
            try {
                const bytes = CryptoJS.AES.decrypt(cipher, SECRET_KEY);
                return bytes.toString(CryptoJS.enc.Utf8) || cipher;
            } catch(e) { return cipher; }
        }

        function formatCNIC(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 5 && v.length <= 12) v = v.slice(0,5) + '-' + v.slice(5);
            else if (v.length > 12) v = v.slice(0,5) + '-' + v.slice(5,12) + '-' + v.slice(12,13);
            input.value = v;
        }

        // Lock Engine
        function lockApp() {
            document.getElementById('pinInput').value = '';
            document.getElementById('pinLockOverlay').classList.remove('hidden');
        }
        function unlockApp() {
            const pin = document.getElementById('pinInput').value;
            if (pin === APP_PIN) {
                document.getElementById('pinLockOverlay').classList.add('hidden');
            } else {
                Swal.fire({ icon: 'error', title: 'Incorrect PIN', text: 'Please enter the correct 4-digit PIN.' });
            }
        }

        // WhatsApp 1-Click Messaging Engine
        function openWhatsApp(phone, name, agreed, received, cnic, pass) {
            if (!phone) {
                Swal.fire({ icon: 'warning', title: 'No Phone Number', text: 'This client has no phone number saved.' });
                return;
            }
            let cleanPhone = phone.replace(/\D/g, '');
            if (cleanPhone.startsWith('0')) cleanPhone = '92' + cleanPhone.substring(1);

            const remaining = (parseFloat(agreed) || 0) - (parseFloat(received) || 0);

            Swal.fire({
                title: 'WhatsApp Message Options',
                text: `Send direct message to ${name || 'Client'}:`,
                showDenyButton: true,
                showCancelButton: true,
                confirmButtonText: '💰 Fee Balance Reminder',
                denyButtonText: '✅ Filing Confirmation',
                cancelButtonText: '🔑 Share Credentials',
                background: '#ffffff'
            }).then((result) => {
                let msg = '';
                if (result.isConfirmed) {
                    msg = `Respected Client ${name}, your remaining tax fee balance is Rs. ${remaining.toLocaleString()}. Please settle at your earliest convenience. - Aqib Arain Tax Advisor`;
                } else if (result.isDenied) {
                    msg = `Dear ${name}, your Income Tax Return has been successfully filed. Thank you for choosing Aqib Arain Tax Advisory!`;
                } else if (result.dismiss === Swal.DismissReason.cancel) {
                    msg = `Dear ${name}, your Tax Portal Credentials:\nCNIC: ${cnic}\nPassword: ${pass}\n- Aqib Arain Tax Vault`;
                }
                if (msg) window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
            });
        }

        function autoCalculateFeeStatus() {
            const agreed = parseFloat(document.getElementById('feeAgreed').value) || 0;
            const received = parseFloat(document.getElementById('feeReceived').value) || 0;
            const statusSelect = document.getElementById('paymentStatus');

            if (received <= 0) statusSelect.value = 'Unpaid';
            else if (received >= agreed && agreed > 0) statusSelect.value = 'Paid';
            else statusSelect.value = 'Partial';
        }

        function updateOnlineStatus() {
            const ind = document.getElementById('syncIndicator');
            if (navigator.onLine) {
                ind.className = "text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-2 py-0.5 rounded-full flex items-center gap-1";
                ind.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online`;
                fetchClients();
            } else {
                ind.className = "text-[10px] bg-amber-50 text-amber-700 border border-amber-200 font-bold px-2 py-0.5 rounded-full flex items-center gap-1";
                ind.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Offline (Saved Locally)`;
                
                const cached = localStorage.getItem('aqib_clients_cache');
                clientsData = cached ? JSON.parse(cached) : [];
                updateCombinedFinancials();
                filterClients();
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        async function fetchClients() {
            if (!navigator.onLine) return;

            try {
                const { data, error } = await db.from('clients').select('*').order('created_at', { ascending: false });
                if (error) {
                    console.error("Supabase Error:", error);
                    const cached = localStorage.getItem('aqib_clients_cache');
                    clientsData = cached ? JSON.parse(cached) : [];
                } else {
                    clientsData = data || [];
                    localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData));
                }
            } catch(err) {
                console.error("Fetch Exception:", err);
                const cached = localStorage.getItem('aqib_clients_cache');
                clientsData = cached ? JSON.parse(cached) : [];
            }
            updateCombinedFinancials();
            filterClients();
        }

        function updateCombinedFinancials() {
            let totalAgreed = 0;
            let totalReceived = 0;

            clientsData.forEach(c => {
                totalAgreed += parseFloat(c.fee_agreed || 0);
                totalReceived += parseFloat(c.fee_received || 0);
            });

            const totalRemaining = totalAgreed - totalReceived;

            document.getElementById('statAgreed').innerText = `Rs. ${totalAgreed.toLocaleString()}`;
            document.getElementById('statReceived').innerText = `Rs. ${totalReceived.toLocaleString()}`;
            document.getElementById('statRemaining').innerText = `Rs. ${totalRemaining.toLocaleString()}`;
            document.getElementById('statTotalClients').innerText = clientsData.length;

            document.getElementById('badgeALL').innerText = clientsData.length;
            document.getElementById('badgeFBR').innerText = clientsData.filter(c => (c.portal_type || 'FBR') === 'FBR').length;
            document.getElementById('badgeGTE').innerText = clientsData.filter(c => c.portal_type === 'GTE').length;
        }

        function switchPortalTab(tab) {
            activeTab = tab;
            ['ALL', 'FBR', 'GTE'].forEach(t => {
                const btn = document.getElementById(`tab${t}`);
                if (t === tab) {
                    btn.className = "px-5 py-2.5 rounded-xl transition flex items-center space-x-2 bg-white text-slate-900 font-bold shadow-sm";
                } else {
                    btn.className = "px-5 py-2.5 rounded-xl transition flex items-center space-x-2 text-slate-600 hover:text-slate-900";
                }
            });
            filterClients();
        }

        function filterClients() {
            const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const payF = document.getElementById('paymentFilter')?.value || 'ALL';
            const conF = document.getElementById('contactFilter')?.value || 'ALL';
            const yearF = document.getElementById('yearFilter')?.value || 'ALL';
            const atlF = document.getElementById('atlFilter')?.value || 'ALL';

            const filtered = clientsData.filter(c => {
                const portal = c.portal_type || 'FBR';
                const matchTab = activeTab === 'ALL' || portal === activeTab;

                const name = (c.full_name || '').toLowerCase();
                const phone = c.phone || '';
                const cnic = c.cnic || '';
                const ntn = (c.ntn || '').toLowerCase();

                const matchSearch = name.includes(query) || phone.includes(query) || cnic.includes(query) || ntn.includes(query);
                const matchPay = payF === 'ALL' || c.payment_status === payF;
                const matchCon = conF === 'ALL' || c.contact_status === conF;
                const matchYear = yearF === 'ALL' || (c.tax_year || '2024') === yearF;
                const matchATL = atlF === 'ALL' || (c.atl_status || 'Active') === atlF;

                return matchTab && matchSearch && matchPay && matchCon && matchYear && matchATL;
            });

            renderClients(filtered);
        }

        function renderClients(list) {
            const grid = document.getElementById('clientGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 executive-card rounded-3xl"><i class="fa-solid fa-folder-open text-4xl mb-3 block text-slate-300"></i>No ${activeTab} clients found matching filters.</div>`;
                return;
            }

            list.forEach(c => {
                const decPass = decryptText(c.tax_portal_password_encrypted);
                const displayName = c.full_name || 'Unnamed Client';
                const portal = c.portal_type || 'FBR';
                const year = c.tax_year || '2024';
                const atl = c.atl_status || 'Active';
                const agreed = parseFloat(c.fee_agreed || 0);
                const received = parseFloat(c.fee_received || 0);
                const remaining = agreed - received;

                const percentPaid = agreed > 0 ? Math.min(Math.round((received / agreed) * 100), 100) : (received > 0 ? 100 : 0);

                let payBadgeClass = "bg-rose-50 text-rose-700 border-rose-200";
                let dotColor = "bg-rose-500";
                if (c.payment_status === 'Paid') { payBadgeClass = "bg-emerald-50 text-emerald-700 border-emerald-200"; dotColor = "bg-emerald-500"; }
                if (c.payment_status === 'Partial') { payBadgeClass = "bg-amber-50 text-amber-700 border-amber-200"; dotColor = "bg-amber-500"; }

                const card = document.createElement('div');
                card.className = "executive-card executive-card-hover p-5 rounded-3xl space-y-4 relative group";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                                <span class="px-2 py-0.5 text-[10px] font-extrabold rounded-md ${portal === 'FBR' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-indigo-100 text-indigo-800 border border-indigo-200'}">${portal}</span>
                                <span class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-blue-50 text-blue-700 border border-blue-200">TY ${year}</span>
                                <span class="px-2 py-0.5 text-[10px] font-bold rounded-md ${atl === 'Active' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${atl === 'Active' ? '🟢 ATL' : '🔴 Inactive'}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-base mt-1 group-hover:text-emerald-700 transition">${displayName}</h3>
                            <div class="text-xs text-slate-500 space-y-0.5 mt-1">
                                <div class="flex items-center space-x-2">
                                    <span><i class="fa-solid fa-phone text-slate-400 w-3.5"></i> ${c.phone || '-'}</span>
                                    ${c.phone ? `<button onclick="openWhatsApp('${c.phone}', '${displayName}', '${agreed}', '${received}', '${c.cnic || ''}', '${decPass}')" class="text-emerald-600 hover:text-emerald-800 font-bold text-sm" title="WhatsApp 1-Click Direct Chat"><i class="fa-brands fa-whatsapp"></i></button>` : ''}
                                </div>
                                <div><i class="fa-solid fa-envelope text-slate-400 w-3.5"></i> ${c.email || '-'}</div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 text-[10px] items-end">
                            <span class="px-2.5 py-1 rounded-full font-semibold border flex items-center gap-1.5 ${payBadgeClass}">
                                <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span> ${c.payment_status || 'Unpaid'}
                            </span>
                            <span class="px-2.5 py-0.5 rounded-full font-medium ${c.contact_status === 'Contacted' ? 'bg-blue-50 text-blue-700' : 'bg-slate-100 text-slate-600'}">${c.contact_status || 'Not Contacted'}</span>
                        </div>
                    </div>

                    <!-- Financial Progress Box -->
                    <div class="bg-slate-50 p-3.5 rounded-2xl space-y-2 border border-slate-100">
                        <div class="flex justify-between text-[11px]">
                            <span class="text-slate-500">Deal: <strong class="text-slate-900">Rs. ${agreed.toLocaleString()}</strong></span>
                            <span class="text-emerald-700 font-bold">Rec: Rs. ${received.toLocaleString()}</span>
                            <span class="text-rose-600 font-semibold">Rem: Rs. ${remaining.toLocaleString()}</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-emerald-500 h-1.5 rounded-full" style="width: ${percentPaid}%"></div>
                        </div>
                    </div>

                    <!-- Credential Vault Box -->
                    <div class="bg-slate-50 p-3 rounded-2xl space-y-1.5 text-xs font-mono border border-slate-100">
                        <div class="flex justify-between"><span class="text-slate-500 font-sans">CNIC:</span><strong class="text-slate-800">${c.cnic || '-'}</strong></div>
                        <div class="flex justify-between"><span class="text-slate-500 font-sans">NTN:</span><strong class="text-slate-800">${c.ntn || '-'}</strong></div>
                        <div class="flex justify-between items-center pt-1 border-t border-slate-200">
                            <span class="text-slate-500 font-sans">Portal Pass:</span>
                            <div class="flex items-center space-x-2">
                                <span id="pass-${c.id}" class="text-slate-900 font-bold tracking-wider">${decPass ? '••••••••' : '-'}</span>
                                ${decPass ? `
                                    <button onclick="togglePassword('${c.id}', '${decPass}')" class="text-slate-400 hover:text-slate-700 transition"><i id="eye-${c.id}" class="fa-solid fa-eye"></i></button>
                                    <button onclick="copyPassword('${decPass}')" class="text-emerald-600 hover:text-emerald-800 transition"><i class="fa-regular fa-copy"></i></button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    ${c.notes ? `<div class="text-xs text-slate-600 bg-amber-50/80 p-2.5 rounded-xl border border-amber-100"><i class="fa-solid fa-sticky-note text-amber-500 mr-1.5"></i>${c.notes}</div>` : ''}

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs">
                        <span class="text-slate-400 text-[10px]">ID: ${c.id ? c.id.substring(0,8) : 'local'}</span>
                        <div class="space-x-3">
                            <button onclick="editClient('${c.id}')" class="text-blue-600 hover:underline"><i class="fa-solid fa-pen"></i> Edit</button>
                            <button onclick="deleteClient('${c.id}')" class="text-rose-600 hover:underline"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function togglePassword(id, rawPassword) {
            const el = document.getElementById(`pass-${id}`);
            const icon = document.getElementById(`eye-${id}`);
            if (el.innerText === '••••••••') {
                el.innerText = rawPassword;
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                el.innerText = '••••••••';
                icon.className = 'fa-solid fa-eye';
            }
        }

        function copyPassword(pass) {
            navigator.clipboard.writeText(pass);
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Password Copied!', showConfirmButton: false, timer: 1500 });
        }

        async function saveClient(e) {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const passVal = document.getElementById('taxPassword').value;

            const payload = {
                portal_type: document.getElementById('portalType').value,
                tax_year: document.getElementById('taxYear').value,
                atl_status: document.getElementById('atlStatus').value,
                full_name: document.getElementById('fullName').value || 'Unnamed Client',
                phone: document.getElementById('phone').value || '',
                email: document.getElementById('email').value || '',
                cnic: document.getElementById('cnic').value || '',
                ntn: document.getElementById('ntn').value || '',
                fee_agreed: parseFloat(document.getElementById('feeAgreed').value) || 0,
                fee_received: parseFloat(document.getElementById('feeReceived').value) || 0,
                tax_portal_password_encrypted: passVal ? encryptText(passVal) : '',
                payment_status: document.getElementById('paymentStatus').value,
                contact_status: document.getElementById('contactStatus').value,
                notes: document.getElementById('notes').value || '',
                id: id || crypto.randomUUID()
            };

            if (id) {
                const idx = clientsData.findIndex(x => x.id === id);
                if (idx !== -1) clientsData[idx] = payload;
            } else {
                clientsData.unshift(payload);
            }
            localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData));
            updateCombinedFinancials();
            filterClients();
            closeClientModal();

            if (navigator.onLine) {
                if (id) await db.from('clients').update(payload).eq('id', id);
                else await db.from('clients').insert([payload]);
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Saved & Synced!', showConfirmButton: false, timer: 1500 });
            } else {
                Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: 'Saved Locally (Offline)', showConfirmButton: false, timer: 2000 });
            }
        }

        function editClient(id) {
            const c = clientsData.find(x => x.id === id);
            if (!c) return;
            document.getElementById('clientId').value = c.id;
            document.getElementById('portalType').value = c.portal_type || 'FBR';
            document.getElementById('taxYear').value = c.tax_year || '2024';
            document.getElementById('atlStatus').value = c.atl_status || 'Active';
            document.getElementById('fullName').value = c.full_name || '';
            document.getElementById('phone').value = c.phone || '';
            document.getElementById('email').value = c.email || '';
            document.getElementById('cnic').value = c.cnic || '';
            document.getElementById('ntn').value = c.ntn || '';
            document.getElementById('feeAgreed').value = c.fee_agreed || 0;
            document.getElementById('feeReceived').value = c.fee_received || 0;
            document.getElementById('taxPassword').value = decryptText(c.tax_portal_password_encrypted);
            document.getElementById('paymentStatus').value = c.payment_status || 'Unpaid';
            document.getElementById('contactStatus').value = c.contact_status || 'Not Contacted';
            document.getElementById('notes').value = c.notes || '';
            document.getElementById('modalTitle').innerText = "Edit Client Record";
            document.getElementById('clientModal').classList.remove('hidden');
        }

        async function deleteClient(id) {
            const result = await Swal.fire({
                title: 'Delete Client Record?',
                text: "This action cannot be undone!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                confirmButtonText: 'Delete'
            });

            if (result.isConfirmed) {
                clientsData = clientsData.filter(x => x.id !== id);
                localStorage.setItem('aqib_clients_cache', JSON.stringify(clientsData));
                updateCombinedFinancials();
                filterClients();

                if (navigator.onLine) {
                    await db.from('clients').delete().eq('id', id);
                }
            }
        }

        function openClientModal() {
            document.getElementById('clientForm').reset();
            document.getElementById('clientId').value = '';
            document.getElementById('portalType').value = activeTab === 'GTE' ? 'GTE' : 'FBR';
            document.getElementById('modalTitle').innerText = "Add Client Record";
            document.getElementById('clientModal').classList.remove('hidden');
        }
        function closeClientModal() { document.getElementById('clientModal').classList.add('hidden'); }

        function exportToCSV() {
            let csv = "Portal,Tax Year,ATL Status,Full Name,Phone,Email,CNIC,NTN,Fee Agreed,Fee Received,Remaining Fee,Tax Password,Payment Status,Contact Status,Notes\n";
            clientsData.forEach(c => {
                const agreed = parseFloat(c.fee_agreed || 0);
                const received = parseFloat(c.fee_received || 0);
                const remaining = agreed - received;
                csv += `"${c.portal_type || 'FBR'}","${c.tax_year || '2024'}","${c.atl_status || 'Active'}","${c.full_name || ''}","${c.phone || ''}","${c.email || ''}","${c.cnic || ''}","${c.ntn || ''}","${agreed}","${received}","${remaining}","${decryptText(c.tax_portal_password_encrypted)}","${c.payment_status || ''}","${c.contact_status || ''}","${c.notes || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Aqib_Arain_Tax_Vault_Backup_${new Date().toISOString().slice(0,10)}.csv`);
            a.click();
        }

        // Initialize App
        updateOnlineStatus();
    </script>
</body>
</html>
