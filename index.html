<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqib Arain - Executive Tax & Portal Vault</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS (AES-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f8fafc; }
        .glass-card { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .glass-card-hover { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card-hover:hover { border-color: rgba(16, 185, 129, 0.3); transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(16, 185, 129, 0.15); }
        .glass-input { background: rgba(11, 15, 23, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; }
        .glass-input:focus { border-color: #10b981; outline: none; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f17; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Top Navigation Header -->
    <nav class="border-b border-slate-800/80 bg-[#0b0f17]/90 backdrop-blur-xl sticky top-0 z-40">

                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-emerald-400 font-black text-xl">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg text-white tracking-tight flex items-center gap-2">
                        Aqib Arain
                        <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-semibold">PRO</span>
                    </h1>
                    <p class="text-xs text-slate-400">Tax Advisor & Credentials Vault</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="exportToCSV()" class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-semibold border border-slate-800 transition flex items-center space-x-2">
                    <i class="fa-brands fa-google-drive text-emerald-400 text-sm"></i>
                    <span class="hidden sm:inline">Drive / CSV Backup</span>
                </button>
                <button onclick="openClientModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-xs shadow-lg shadow-emerald-500/25 transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>New Client Record</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-8">

        <!-- Combined Financial Analytics Bar -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-5 rounded-2xl flex items-center justify-between relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-blue-500/5 rounded-full blur-xl"></div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Deal Value</p>
                    <h3 id="statAgreed" class="text-xl md:text-2xl font-black text-white mt-1">Rs. 0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center text-lg"><i class="fa-solid fa-handshake"></i></div>
            </div>

            <div class="glass-card p-5 rounded-2xl flex items-center justify-between relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-emerald-500/10 rounded-full blur-xl"></div>
                <div>
                    <p class="text-xs font-medium text-emerald-400 uppercase tracking-wider">Combined Received</p>
                    <h3 id="statReceived" class="text-xl md:text-2xl font-black text-emerald-400 mt-1">Rs. 0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg"><i class="fa-solid fa-wallet"></i></div>
            </div>

            <div class="glass-card p-5 rounded-2xl flex items-center justify-between relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-rose-500/10 rounded-full blur-xl"></div>
                <div>
                    <p class="text-xs font-medium text-rose-400 uppercase tracking-wider">Combined Remaining</p>
                    <h3 id="statRemaining" class="text-xl md:text-2xl font-black text-rose-400 mt-1">Rs. 0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center text-lg"><i class="fa-solid fa-scale-unbalanced"></i></div>
            </div>

            <div class="glass-card p-5 rounded-2xl flex items-center justify-between relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-purple-500/5 rounded-full blur-xl"></div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Active Records</p>
                    <h3 id="statTotalClients" class="text-xl md:text-2xl font-black text-purple-400 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center text-lg"><i class="fa-solid fa-users-viewfinder"></i></div>
            </div>
        </div>

        <!-- Segmented Portal Tabs & Search -->
        <div class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <!-- Portal Segmented Tabs -->
                <div class="bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800 flex space-x-1 text-xs font-medium">
                    <button onclick="switchPortalTab('ALL')" id="tabALL" class="px-5 py-2.5 rounded-xl transition flex items-center space-x-2 bg-emerald-500 text-slate-950 font-bold shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>All Clients</span>
                        <span id="badgeALL" class="ml-1 px-2 py-0.5 rounded-full bg-slate-950/30 text-slate-950 text-[10px]">0</span>
                    </button>
                    <button onclick="switchPortalTab('FBR')" id="tabFBR" class="px-5 py-2.5 rounded-xl transition flex items-center space-x-2 text-slate-400 hover:text-white">
                        <i class="fa-solid fa-building-columns text-emerald-400"></i>
                        <span>FBR Portal</span>
                        <span id="badgeFBR" class="ml-1 px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 text-[10px]">0</span>
                    </button>
                    <button onclick="switchPortalTab('GTE')" id="tabGTE" class="px-5 py-2.5 rounded-xl transition flex items-center space-x-2 text-slate-400 hover:text-white">
                        <i class="fa-solid fa-briefcase text-purple-400"></i>
                        <span>GTE Portal</span>
                        <span id="badgeGTE" class="ml-1 px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 text-[10px]">0</span>
                    </button>
                </div>

                <!-- Filters -->
                <div class="flex items-center space-x-2 text-xs">
                    <select id="paymentFilter" onchange="filterClients()" class="glass-input rounded-xl px-3 py-2.5 text-slate-300">
                        <option value="ALL">All Payments</option>
                        <option value="Paid">Paid Only</option>
                        <option value="Partial">Partial Pay</option>
                        <option value="Unpaid">Unpaid Only</option>
                    </select>
                    <select id="contactFilter" onchange="filterClients()" class="glass-input rounded-xl px-3 py-2.5 text-slate-300">
                        <option value="ALL">All Contacts</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Not Contacted">Not Contacted</option>
                    </select>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterClients()" placeholder="Search Client Name, Phone, CNIC (12345-1234567-1), or NTN..." 
                    class="w-full pl-11 pr-4 py-3 rounded-2xl glass-input text-sm placeholder-slate-500">
            </div>
        </div>

        <!-- Client Cards Grid -->
        <div id="clientGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Dynamic Cards Loaded Here -->
        </div>

    </div>

    <!-- Modal Drawer (Zero Required Fields) -->
    <div id="clientModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex justify-center items-center p-4 hidden">
        <div class="glass-card rounded-3xl max-w-lg w-full p-6 space-y-5 border border-slate-700/60 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <div class="flex items-center space-x-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
                    <h2 id="modalTitle" class="font-bold text-white text-lg">Add Client Record</h2>
                </div>
                <button onclick="closeClientModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="clientForm" onsubmit="saveClient(event)" class="space-y-4 text-xs">
                <input type="hidden" id="clientId">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-300 mb-1.5">Portal Category</label>
                        <select id="portalType" class="w-full p-3 rounded-xl glass-input font-bold text-emerald-400">
                            <option value="FBR">FBR Portal</option>
                            <option value="GTE">GTE Portal</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-300 mb-1.5">Full Name</label>
                        <input type="text" id="fullName" placeholder="Optional" class="w-full p-3 rounded-xl glass-input">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-300 mb-1.5">Phone Number</label>
                        <input type="text" id="phone" placeholder="Optional" class="w-full p-3 rounded-xl glass-input">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-300 mb-1.5">Email Address</label>
                        <input type="email" id="email" placeholder="Optional" class="w-full p-3 rounded-xl glass-input">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-300 mb-1.5">CNIC Number</label>
                        <input type="text" id="cnic" placeholder="12345-1234567-1" oninput="formatCNIC(this)" maxlength="15" class="w-full p-3 rounded-xl glass-input font-mono">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-300 mb-1.5">NTN Number</label>
                        <input type="text" id="ntn" placeholder="Optional" class="w-full p-3 rounded-xl glass-input font-mono">
                    </div>
                </div>

                <!-- Fee Deal Section -->
                <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-200 text-xs flex items-center gap-1.5"><i class="fa-solid fa-coins text-amber-400"></i> Fee & Deal Tracking</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-400 mb-1">Deal Fee (Rs.)</label>
                            <input type="number" id="feeAgreed" placeholder="0" oninput="autoCalculateFeeStatus()" class="w-full p-2.5 rounded-xl glass-input font-mono">
                        </div>
                        <div>
                            <label class="block font-medium text-slate-400 mb-1">Fee Received (Rs.)</label>
                            <input type="number" id="feeReceived" placeholder="0" oninput="autoCalculateFeeStatus()" class="w-full p-2.5 rounded-xl glass-input font-mono font-bold text-emerald-400">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <div>
                            <label class="block font-medium text-slate-400 mb-1">Payment Status</label>
                            <select id="paymentStatus" class="w-full p-2.5 rounded-xl glass-input">
                                <option value="Unpaid">Unpaid</option>
                                <option value="Partial">Partial Pay</option>
                                <option value="Paid">Paid</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-400 mb-1">Contact Status</label>
                            <select id="contactStatus" class="w-full p-2.5 rounded-xl glass-input">
                                <option value="Not Contacted">Not Contacted</option>
                                <option value="Contacted">Contacted</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-300 mb-1.5">Tax Portal Password</label>
                    <input type="text" id="taxPassword" placeholder="Optional Password" class="w-full p-3 rounded-xl glass-input font-mono">
                </div>

                <div>
                    <label class="block font-medium text-slate-300 mb-1.5">Notes / Filing Details</label>
                    <textarea id="notes" rows="2" placeholder="Optional Notes..." class="w-full p-3 rounded-xl glass-input"></textarea>
                </div>

                <div class="pt-4 flex justify-end space-x-2 border-t border-slate-800">
                    <button type="button" onclick="closeClientModal()" class="px-5 py-2.5 rounded-xl text-slate-400 hover:text-white transition">Cancel</button>
                    <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition">Save Client</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        const SUPABASE_URL = "https://xmrprtdsucbqkyflbgfj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_MfURv5DghN1mAHOHhgpYhA_TtiuEdtT"; 
        const SECRET_KEY = "tax-advisor-secret-key";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let clientsData = [];
        let activeTab = 'ALL';

        function encryptText(text) { return text ? CryptoJS.AES.encrypt(text, SECRET_KEY).toString() : ''; }
        function decryptText(cipher) { 
            if (!cipher) return '';
            try {
                const bytes = CryptoJS.AES.decrypt(cipher, SECRET_KEY);
                return bytes.toString(CryptoJS.enc.Utf8) || cipher;
            } catch(e) { return cipher; }
        }

        function formatCNIC(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 5 && v.length <= 12) v = v.slice(0,5) + '-' + v.slice(5);
            else if (v.length > 12) v = v.slice(0,5) + '-' + v.slice(5,12) + '-' + v.slice(12,13);
            input.value = v;
        }

        function autoCalculateFeeStatus() {
            const agreed = parseFloat(document.getElementById('feeAgreed').value) || 0;
            const received = parseFloat(document.getElementById('feeReceived').value) || 0;
            const statusSelect = document.getElementById('paymentStatus');

            if (received <= 0) statusSelect.value = 'Unpaid';
            else if (received >= agreed && agreed > 0) statusSelect.value = 'Paid';
            else statusSelect.value = 'Partial';
        }

        async function fetchClients() {
            const { data, error } = await db.from('clients').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error("Error:", error);
                return;
            }
            clientsData = data || [];
            updateCombinedFinancials();
            filterClients();
        }

        function updateCombinedFinancials() {
            let totalAgreed = 0;
            let totalReceived = 0;

            clientsData.forEach(c => {
                totalAgreed += parseFloat(c.fee_agreed || 0);
                totalReceived += parseFloat(c.fee_received || 0);
            });

            const totalRemaining = totalAgreed - totalReceived;

            document.getElementById('statAgreed').innerText = `Rs. ${totalAgreed.toLocaleString()}`;
            document.getElementById('statReceived').innerText = `Rs. ${totalReceived.toLocaleString()}`;
            document.getElementById('statRemaining').innerText = `Rs. ${totalRemaining.toLocaleString()}`;
            document.getElementById('statTotalClients').innerText = clientsData.length;

            document.getElementById('badgeALL').innerText = clientsData.length;
            document.getElementById('badgeFBR').innerText = clientsData.filter(c => (c.portal_type || 'FBR') === 'FBR').length;
            document.getElementById('badgeGTE').innerText = clientsData.filter(c => c.portal_type === 'GTE').length;
        }

        function switchPortalTab(tab) {
            activeTab = tab;
            ['ALL', 'FBR', 'GTE'].forEach(t => {
                const btn = document.getElementById(`tab${t}`);
                if (t === tab) {
                    btn.className = "px-5 py-2.5 rounded-xl transition flex items-center space-x-2 bg-emerald-500 text-slate-950 font-bold shadow-lg shadow-emerald-500/20";
                } else {
                    btn.className = "px-5 py-2.5 rounded-xl transition flex items-center space-x-2 text-slate-400 hover:text-white";
                }
            });
            filterClients();
        }

        function filterClients() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const payF = document.getElementById('paymentFilter').value;
            const conF = document.getElementById('contactFilter').value;

            const filtered = clientsData.filter(c => {
                const portal = c.portal_type || 'FBR';
                const matchTab = activeTab === 'ALL' || portal === activeTab;

                const name = (c.full_name || '').toLowerCase();
                const phone = c.phone || '';
                const cnic = c.cnic || '';
                const ntn = (c.ntn || '').toLowerCase();

                const matchSearch = name.includes(query) || phone.includes(query) || cnic.includes(query) || ntn.includes(query);
                const matchPay = payF === 'ALL' || c.payment_status === payF;
                const matchCon = conF === 'ALL' || c.contact_status === conF;

                return matchTab && matchSearch && matchPay && matchCon;
            });

            renderClients(filtered);
        }

        function renderClients(list) {
            const grid = document.getElementById('clientGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 glass-card rounded-3xl"><i class="fa-solid fa-folder-open text-4xl mb-3 block text-slate-600"></i>No ${activeTab} clients found.</div>`;
                return;
            }

            list.forEach(c => {
                const decPass = decryptText(c.tax_portal_password_encrypted);
                const displayName = c.full_name || 'Unnamed Client';
                const portal = c.portal_type || 'FBR';
                const agreed = parseFloat(c.fee_agreed || 0);
                const received = parseFloat(c.fee_received || 0);
                const remaining = agreed - received;

                const percentPaid = agreed > 0 ? Math.min(Math.round((received / agreed) * 100), 100) : (received > 0 ? 100 : 0);

                let payBadgeClass = "bg-rose-500/10 text-rose-400 border-rose-500/20";
                let dotColor = "bg-rose-400";
                if (c.payment_status === 'Paid') { payBadgeClass = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"; dotColor = "bg-emerald-400"; }
                if (c.payment_status === 'Partial') { payBadgeClass = "bg-amber-500/10 text-amber-400 border-amber-500/20"; dotColor = "bg-amber-400"; }

                const card = document.createElement('div');
                card.className = "glass-card glass-card-hover p-5 rounded-3xl space-y-4 relative group";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2.5 py-0.5 text-[10px] font-extrabold rounded-md ${portal === 'FBR' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-purple-500/20 text-purple-400 border border-purple-500/30'}">${portal}</span>
                                <h3 class="font-bold text-white text-base group-hover:text-emerald-400 transition">${displayName}</h3>
                            </div>
                            <div class="text-xs text-slate-400 space-y-0.5 mt-2">
                                <div><i class="fa-solid fa-phone text-slate-500 w-4"></i> ${c.phone || '-'}</div>
                                <div><i class="fa-solid fa-envelope text-slate-500 w-4"></i> ${c.email || '-'}</div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 text-[10px] items-end">
                            <span class="px-2.5 py-1 rounded-full font-semibold border flex items-center gap-1.5 ${payBadgeClass}">
                                <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span> ${c.payment_status || 'Unpaid'}
                            </span>
                            <span class="px-2.5 py-0.5 rounded-full font-medium ${c.contact_status === 'Contacted' ? 'bg-blue-500/10 text-blue-400' : 'bg-slate-800 text-slate-400'}">${c.contact_status || 'Not Contacted'}</span>
                        </div>
                    </div>

                    <!-- Financial Progress Box -->
                    <div class="bg-slate-900/80 p-3.5 rounded-2xl space-y-2 border border-slate-800/80">
                        <div class="flex justify-between text-[11px]">
                            <span class="text-slate-400">Deal: <strong class="text-white">Rs. ${agreed.toLocaleString()}</strong></span>
                            <span class="text-emerald-400 font-bold">Received: Rs. ${received.toLocaleString()}</span>
                            <span class="text-rose-400 font-semibold">Rem: Rs. ${remaining.toLocaleString()}</span>
                        </div>
                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-1.5 rounded-full" style="width: ${percentPaid}%"></div>
                        </div>
                    </div>

                    <!-- Credential Vault Box -->
                    <div class="bg-slate-950/60 p-3 rounded-2xl space-y-2 text-xs font-mono border border-slate-800/60">
                        <div class="flex justify-between"><span class="text-slate-500 font-sans">CNIC:</span><strong class="text-slate-200">${c.cnic || '-'}</strong></div>
                        <div class="flex justify-between"><span class="text-slate-500 font-sans">NTN:</span><strong class="text-slate-200">${c.ntn || '-'}</strong></div>
                        <div class="flex justify-between items-center pt-1 border-t border-slate-800/80">
                            <span class="text-slate-500 font-sans">Portal Pass:</span>
                            <div class="flex items-center space-x-2">
                                <span id="pass-${c.id}" class="text-emerald-400 font-bold tracking-wider">${decPass ? '••••••••' : '-'}</span>
                                ${decPass ? `
                                    <button onclick="togglePassword('${c.id}', '${decPass}')" class="text-slate-400 hover:text-white transition"><i id="eye-${c.id}" class="fa-solid fa-eye"></i></button>
                                    <button onclick="copyPassword('${decPass}')" class="text-emerald-400 hover:text-emerald-300 transition"><i class="fa-regular fa-copy"></i></button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    ${c.notes ? `<div class="text-xs text-slate-300 bg-amber-500/5 p-2.5 rounded-xl border border-amber-500/10"><i class="fa-solid fa-pen-nib text-amber-400 mr-1.5"></i>${c.notes}</div>` : ''}

                    <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-xs">
                        <span class="text-slate-500 text-[10px]">ID: ${c.id.substring(0,8)}</span>
                        <div class="space-x-3">
                            <button onclick="editClient('${c.id}')" class="text-blue-400 hover:text-blue-300 transition"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                            <button onclick="deleteClient('${c.id}')" class="text-rose-400 hover:text-rose-300 transition"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function togglePassword(id, rawPassword) {
            const el = document.getElementById(`pass-${id}`);
            const icon = document.getElementById(`eye-${id}`);
            if (el.innerText === '••••••••') {
                el.innerText = rawPassword;
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                el.innerText = '••••••••';
                icon.className = 'fa-solid fa-eye';
            }
        }

        function copyPassword(pass) {
            navigator.clipboard.writeText(pass);
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Password Copied!', showConfirmButton: false, timer: 1500, background: '#1e293b', color: '#fff' });
        }

        async function saveClient(e) {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const passVal = document.getElementById('taxPassword').value;

            const payload = {
                portal_type: document.getElementById('portalType').value,
                full_name: document.getElementById('fullName').value || 'Unnamed Client',
                phone: document.getElementById('phone').value || '',
                email: document.getElementById('email').value || '',
                cnic: document.getElementById('cnic').value || '',
                ntn: document.getElementById('ntn').value || '',
                fee_agreed: parseFloat(document.getElementById('feeAgreed').value) || 0,
                fee_received: parseFloat(document.getElementById('feeReceived').value) || 0,
                tax_portal_password_encrypted: passVal ? encryptText(passVal) : '',
                payment_status: document.getElementById('paymentStatus').value,
                contact_status: document.getElementById('contactStatus').value,
                notes: document.getElementById('notes').value || ''
            };

            let res;
            if (id) res = await db.from('clients').update(payload).eq('id', id);
            else res = await db.from('clients').insert([payload]);

            if (res.error) {
                Swal.fire({ icon: 'error', title: 'Save Failed', text: res.error.message, background: '#1e293b', color: '#fff' });
            } else {
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Saved Successfully!', showConfirmButton: false, timer: 1500, background: '#1e293b', color: '#fff' });
                closeClientModal();
                fetchClients();
            }
        }

        function editClient(id) {
            const c = clientsData.find(x => x.id === id);
            if (!c) return;
            document.getElementById('clientId').value = c.id;
            document.getElementById('portalType').value = c.portal_type || 'FBR';
            document.getElementById('fullName').value = c.full_name || '';
            document.getElementById('phone').value = c.phone || '';
            document.getElementById('email').value = c.email || '';
            document.getElementById('cnic').value = c.cnic || '';
            document.getElementById('ntn').value = c.ntn || '';
            document.getElementById('feeAgreed').value = c.fee_agreed || 0;
            document.getElementById('feeReceived').value = c.fee_received || 0;
            document.getElementById('taxPassword').value = decryptText(c.tax_portal_password_encrypted);
            document.getElementById('paymentStatus').value = c.payment_status || 'Unpaid';
            document.getElementById('contactStatus').value = c.contact_status || 'Not Contacted';
            document.getElementById('notes').value = c.notes || '';
            document.getElementById('modalTitle').innerText = "Edit Client Record";
            document.getElementById('clientModal').classList.remove('hidden');
        }

        async function deleteClient(id) {
            const result = await Swal.fire({
                title: 'Delete Client Record?',
                text: "This record will be permanently deleted!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Yes, Delete',
                background: '#1e293b',
                color: '#fff'
            });

            if (result.isConfirmed) {
                await db.from('clients').delete().eq('id', id);
                fetchClients();
            }
        }

        function openClientModal() {
            document.getElementById('clientForm').reset();
            document.getElementById('clientId').value = '';
            document.getElementById('portalType').value = activeTab === 'GTE' ? 'GTE' : 'FBR';
            document.getElementById('modalTitle').innerText = "Add Client Record";
            document.getElementById('clientModal').classList.remove('hidden');
        }
        function closeClientModal() { document.getElementById('clientModal').classList.add('hidden'); }

        function exportToCSV() {
            let csv = "Portal,Full Name,Phone,Email,CNIC,NTN,Fee Agreed,Fee Received,Remaining Fee,Tax Password,Payment Status,Contact Status,Notes\n";
            clientsData.forEach(c => {
                const agreed = parseFloat(c.fee_agreed || 0);
                const received = parseFloat(c.fee_received || 0);
                const remaining = agreed - received;
                csv += `"${c.portal_type || 'FBR'}","${c.full_name || ''}","${c.phone || ''}","${c.email || ''}","${c.cnic || ''}","${c.ntn || ''}","${agreed}","${received}","${remaining}","${decryptText(c.tax_portal_password_encrypted)}","${c.payment_status || ''}","${c.contact_status || ''}","${c.notes || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Aqib_Arain_Tax_Backup_${new Date().toISOString().slice(0,10)}.csv`);
            a.click();
        }

        fetchClients();
    </script>
</body>
</html>
